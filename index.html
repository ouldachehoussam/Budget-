</style></head><body>
<header><h1>💰 My Budget</h1><input type="month" id="m" style="flex:0"><button onclick="T='s';R()" style="flex:0;padding:8px 10px">⚙️</button></header>
<main id="v"></main><div id="sh" onclick="if(event.target===this)closeQ()"></div><button id="fab" onclick="openQ()">+</button>
<nav><button data-t="o"><span>📊</span>Overview</button><button data-t="t"><span>🧾</span>Activity</button><button data-t="d"><span>💳</span>Debts</button><button data-t="f"><span>🤝</span>Friends</button><button data-t="b"><span>🎯</span>Budgets</button></nav>
<script>
const EC=['Housing','Food','Market','Transport','Health','Bills','Leisure','Debt','Other'],IC=['Salary','Freelance','Repaid','Other'];
const EM={Housing:'🏠',Food:'🍽️',Transport:'🚗',Health:'💊',Bills:'🧾',Leisure:'🎮',Debt:'💳',Other:'📦',Salary:'💼',Freelance:'💻',Market:'🛒',Repaid:'🤝'};
const CL={Housing:'#6366f1',Food:'#f59e0b',Transport:'#0ea5e9',Health:'#10b981',Bills:'#8b5cf6',Leisure:'#ec4899',Debt:'#ef4444',Market:'#14b8a6',Other:'#64748b'};
let UN=false,S={tx:[],debts:[],bud:{}},T='o',M=new Date().toISOString().slice(0,7);
try{const r=localStorage.getItem('budget-v1');if(r)S=JSON.parse(r)}catch(e){}
S.obl=S.obl||[];S.obl.forEach(o=>{if(o.day>31)o.day=0});S.fr=S.fr||[];S.chk=S.chk||{};S.incM=S.incM||{};S.accs=S.accs||[];S.xf=S.xf||[];S.fx=S.fx||{EUR:150,USD:135};
const save=()=>{try{localStorage.setItem('budget-v1',JSON.stringify(S))}catch(e){}};
const f=n=>Math.round(n).toLocaleString('en-US')+' DA',esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const $=i=>document.getElementById(i);
const mt=()=>S.tx.filter(t=>t.date.slice(0,7)===M);
const sum=(a,ty)=>a.filter(t=>t.type===ty).reduce((s,t)=>s+t.amount,0);
const net=()=>sum(S.tx,'in')-sum(S.tx,'out'),cash=()=>accs().reduce((s,a)=>s+bal(a.id),0);
const opts=a=>a.map(x=>`<option>${x}</option>`).join('');
function R(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('a',b.dataset.t===T));
 $('m').value=M;$('v').innerHTML=(S.pin&&!UN)?lock():S.start===undefined?welcome():{o:ov,t:tr,d:db,f:frT,s:sv,a:av,b:bu}[T]();document.querySelector('nav').style.display=(S.start===undefined||(S.pin&&!UN))?'none':'flex';$('fab').style.display=(S.start===undefined||(S.pin&&!UN)||T==='s')?'none':'block';
 if(T==='t')cats('',ED&&ED.cat);
}
function ov(){
 const a=mt(),i=sum(a,'in'),e=sum(a,'out'),bal=i-e,debt=S.debts.reduce((s,d)=>s+Math.max(0,d.total-d.paid),0),cs=cash();
 const by={};a.filter(t=>t.type==='out').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
 return `<div class="c hero"><div class="k">Money I have now</div><input type="number" inputmode="decimal" placeholder="Tap to enter" value="${S.start!==undefined||S.tx.length?Math.round(cs):''}" onchange="setCash(this.value)">
<div class="chips"><div class="chip"><span class="k">Debts to pay</span><b>${f(debt)}</b></div><div class="chip"><span class="k">Owed to me</span><b>${f(owed())}</b></div></div></div>
${plan(a,i,e)}${accCard()}${goalCard()}${dueCard()}
<div class="g"><div class="c s i"><div class="k">⬆️ Income</div><div class="v in">${f(i)}</div></div>
<div class="c s o"><div class="k">⬇️ Expenses</div><div class="v out">${f(e)}</div></div>
<div class="c s b"><div class="k">⚖️ Month balance</div><div class="v ${bal<0?'out':''}">${f(bal)}</div></div>
<div class="c s d"><div class="k">💳 Debt left</div><div class="v">${f(debt)}</div></div></div>
<div class="c"><h2>Spending by category</h2>${Object.keys(by).length?Object.entries(by).sort((x,y)=>y[1]-x[1]).map(([c,v])=>{const l=S.bud[c],p=l?Math.min(100,v/l*100):e?v/e*100:0;return `<div style="margin-bottom:8px"><div class="r"><span>${EM[c]} ${c}</span><span style="text-align:right">${f(v)}${l?' / '+f(l):''}</span></div><div class="bar"><i class="${l&&v>l?'w':''}" style="width:${p}%;${l&&v>l?'':'background:'+CL[c]}"></i></div></div>`}).join(''):'<div class="k">No expenses this month.</div>'}</div>${chart()}`;
}
function setCash(v){S.start=(parseFloat(v)||0)-(cash()-(S.start||0));save();R()}
function welcome(){return `<div class="c hero" style="margin-top:40px"><div style="font-size:36px">👋</div><h2 style="font-size:20px;margin-top:6px">Welcome!</h2><div class="k">How much money do you have right now (cash + bank savings)? You can change it later from the Overview.</div><input id="w0" type="number" inputmode="decimal" placeholder="0 DA" style="margin:16px 0"><button class="p" style="width:100%" onclick="setCash($('w0').value)">Start</button></div>`}
function tr(){
 const a=mt().sort((x,y)=>y.date.localeCompare(x.date));
 return `<div class="c"><h2>New transaction</h2><div class="r"><select id="ty" onchange="cats()"><option value="out">⬇️ Expense</option><option value="in">⬆️ Income</option></select><input id="am" type="number" inputmode="decimal" placeholder="Amount"></div>
<div class="r" style="margin-top:8px"><select id="ct"></select><input id="dt" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
<div class="r" style="margin-top:8px"><input id="nt" placeholder="Note (optional)"><button class="p" onclick="addT()" style="flex:0">Add</button></div></div>
<div class="c">${a.length?a.map(t=>`<div class="row"><div class="ic">${EM[t.cat]||'📦'}</div><div style="flex:1"><div>${esc(t.note)||t.cat}</div><div class="k">${t.date} · ${t.cat}</div></div><b class="${t.type}">${t.type==='in'?'+':'-'}${f(t.amount)}</b><button class="x" onclick="delT('${t.id}')">✕</button></div>`).join(''):'<div class="k">No transactions this month.</div>'}</div>`;
}
function cats(){const t=$('ty'),c=$('ct');if(t&&c)c.innerHTML=opts(t.value==='in'?IC:EC)}
function addT(){const am=parseFloat($('am').value);if(!(am>0))return;S.tx.push({id:id(),type:$('ty').value,amount:am,cat:$('ct').value,date:$('dt').value||M+'-01',note:$('nt').value.trim()});save();R()}
function delT(i){S.tx=S.tx.filter(t=>t.id!==i);save();R()}
function dbOld(){
 return `<div class="c"><h2>Add a debt</h2><div class="r"><input id="dn" placeholder="Name (e.g. Car loan)"><input id="dtot" type="number" inputmode="decimal" placeholder="Total"></div><div class="r" style="margin-top:8px"><input id="dmo" type="number" inputmode="decimal" placeholder="Monthly payment"><button class="p" onclick="addD()" style="flex:0">Add</button></div></div>
${S.debts.map(d=>{const left=Math.max(0,d.total-d.paid),p=d.total?Math.min(100,d.paid/d.total*100):0,mo=d.monthly>0&&left>0?Math.ceil(left/d.monthly):0;return `<div class="c"><div class="r"><b>💳 ${esc(d.name)}</b><span style="text-align:right" class="out"><b>${f(left)}</b> left</span><button class="x" onclick="delD('${d.id}')">✕</button></div><div class="bar"><i style="width:${p}%;background:var(--in)"></i></div><div class="k">Paid ${f(d.paid)} of ${f(d.total)} (${Math.round(p)}%)${mo?` · about ${mo} months left at ${f(d.monthly)}/mo`:''}</div>${left>0?`<div class="r" style="margin-top:10px"><input id="p${d.id}" type="number" inputmode="decimal" placeholder="Payment" value="${d.monthly||''}"><button class="p" onclick="payD('${d.id}')">Pay</button></div>`:'<div class="in" style="margin-top:6px"><b>Paid off ✓</b></div>'}</div>`}).join('')||'<div class="k" style="text-align:center">No debts recorded.</div>'}`;
}
function addD(){const t=parseFloat($('dtot').value),n=$('dn').value.trim();if(!n||!(t>0))return;S.debts.push({id:id(),name:n,total:t,paid:0,monthly:parseFloat($('dmo').value)||0,due:$('ddue').value||''});save();R()}
function delD(i){S.debts=S.debts.filter(d=>d.id!==i);save();R()}
function payD(i){const d=S.debts.find(x=>x.id===i),a=Math.min(parseFloat($('p'+i).value),d.total-d.paid);if(!(a>0))return;d.paid+=a;S.tx.push({id:id(),type:'out',amount:a,cat:'Debt',did:i,date:new Date().toISOString().slice(0,10),note:'Payment: '+d.name});save();R()}
function bu(){
 const by={};mt().filter(t=>t.type==='out').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
 return `<div class="c"><h2>🎯 Plan</h2><div class="row"><span style="flex:1">Monthly savings goal</span><input type="number" inputmode="decimal" style="width:120px" placeholder="0" value="${S.goal||''}" onchange="setP('goal',this.value)"></div></div>
<div class="c"><h2>🏁 Savings target</h2><div class="row"><span style="flex:1">Name</span><input style="width:150px" placeholder="Emergency fund" value="${esc((S.sg||{}).name)}" onchange="setSG('name',this.value)"></div><div class="row"><span style="flex:1">Target amount</span><input type="number" inputmode="decimal" style="width:150px" value="${(S.sg||{}).amt||''}" onchange="setSG('amt',this.value)"></div><div class="row"><span style="flex:1">Reach it by</span><input type="month" style="width:150px" value="${(S.sg||{}).date||''}" onchange="setSG('date',this.value)"></div></div><div class="c"><h2>Monthly limit per category</h2>${EC.map(c=>`<div class="row"><div class="ic">${EM[c]}</div><span style="flex:1">${c}<div class="k">Spent: ${f(by[c]||0)}</div></span><input type="number" inputmode="decimal" style="width:120px" placeholder="No limit" value="${S.bud[c]||''}" onchange="setB('${c}',this.value)"></div>`).join('')}</div>`;
}
function setB(c,v){S.bud[c]=parseFloat(v)||0;save()}
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};
const mkey=k=>{const [y,m]=M.split('-').map(Number),d=new Date(y,m-1-k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const autoInc=()=>{const v=[1,2,3].map(k=>S.tx.filter(t=>t.type==='in'&&t.cat!=='Repaid'&&t.date.slice(0,7)===mkey(k)).reduce((s,t)=>s+t.amount,0)).filter(x=>x>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0};
const expInc=()=>S.incM[M]>0?S.incM[M]:(autoInc()||S.inc||0);
function setI(v){S.incM[M]=parseFloat(v)||0;save();R()}
let ED=null,Q={s:'',c:'',t:'',all:0};
